<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Чип-тюнинг и калибровка ЭБУ удалённо | Kalibr-ECU</title>

<meta name="description" content="Удалённая калибровка ЭБУ. Отключение AdBlue, DPF, EGR. Stage 1 до +30% мощности. Работа по всей России.">
<meta name="keywords" content="чип тюнинг, эбу, stage 1, adblue off, dpf off, egr off">

<style>
:root {
  --primary:#0A0E1A;
  --card:#111827;
  --blue:#0066FF;
  --text:#fff;
  --muted:#8899A6;
  --border:#1E2A3A;
}

body {
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--primary);
  color:var(--text);
}

.container { max-width:1100px; margin:auto; padding:20px; }

.section { padding:60px 0; }

h1,h2,h3 { margin:0 0 15px 0; }

.btn {
  display:inline-block;
  padding:14px 24px;
  background:linear-gradient(135deg,#0066FF,#0099FF);
  color:#fff;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
  cursor:pointer;
  border:none;
}

.card {
  background:var(--card);
  border:1px solid var(--border);
  padding:20px;
  border-radius:14px;
}

/* ===== HERO ===== */
.hero {
  padding:100px 0;
  text-align:center;
}

/* ===== CALCULATOR ===== */
.calc-box {
  max-width:600px;
  margin:40px auto;
  padding:25px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(255,255,255,0.03);
}

select {
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  background:#0f172a;
  color:#fff;
  border:1px solid var(--border);
}

.result {
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:#0b1220;
  display:none;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <div class="container">
    <h1>Калибровка ЭБУ и Чип-тюнинг</h1>
    <p>Stage 1 / DPF / EGR / AdBlue OFF</p>
    <a class="btn" href="#calc">Рассчитать мощность</a>
  </div>
</div>

<!-- CALCULATOR -->
<section class="section" id="calc">
  <div class="container">

    <h2 style="text-align:center;">Узнайте прирост мощности</h2>

    <div class="calc-box">

      <select id="brandSelect">
        <option value="">Выберите марку</option>
        <option value="vag">VAG</option>
        <option value="bmw">BMW</option>
        <option value="merc">Mercedes</option>
        <option value="china">China Truck</option>
      </select>

      <select id="modelSelect">
        <option value="">Сначала выберите марку</option>
      </select>

      <button class="btn" style="width:100%;" onclick="calcStage()">
        Рассчитать Stage 1
      </button>

      <div id="calcResult" class="result"></div>

    </div>

  </div>
</section>

<script>
/* ===== DATABASE ===== */
const DB = {
  vag: {
    "2.0 TSI EA888 Gen3": { hp:220,nm:350,sh:300,sn:450 },
    "2.0 TSI EA888 Gen4": { hp:245,nm:370,sh:330,sn:480 },
    "2.0 TDI 140": { hp:140,nm:320,sh:185,sn:420 },
    "2.0 TDI 184": { hp:184,nm:380,sh:230,sn:480 }
  },

  bmw: {
    "B48 2.0 Turbo": { hp:184,nm:300,sh:260,sn:420 },
    "B58 3.0 Turbo": { hp:340,nm:500,sh:420,sn:620 }
  },

  merc: {
    "OM651 2.1 CDI": { hp:170,nm:400,sh:210,sn:480 }
  },

  china: {
    "Cummins ISF 3.8": { hp:152,nm:491,sh:185,sn:560 },
    "Weichai 12L": { hp:420,nm:2000,sh:480,sn:2300 }
  }
};

/* ===== UI LOGIC ===== */
const brand = document.getElementById("brandSelect");
const model = document.getElementById("modelSelect");

brand.addEventListener("change", () => {
  model.innerHTML = '<option value="">Выберите двигатель</option>';
  if (!DB[brand.value]) return;

  Object.keys(DB[brand.value]).forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    model.appendChild(opt);
  });
});

/* ===== CALC ===== */
function calcStage() {

  const b = brand.value;
  const m = model.value;

  if (!b || !m) return;

  const d = DB[b][m];

  const el = document.getElementById("calcResult");
  el.style.display = "block";

  el.innerHTML = `
    <h3>${m}</h3>
    <p>Сток: ${d.hp} л.с. / ${d.nm} Нм</p>
    <p><b>Stage 1: ${d.sh} л.с. / ${d.sn} Нм</b></p>
    <p style="color:#0099ff;">
      +${d.sh - d.hp} л.с. / +${d.sn - d.nm} Нм
    </p>

    <a class="btn" style="display:block;text-align:center;margin-top:15px;"
       href="https://t.me/kalibr_compass">
      Получить прошивку
    </a>
  `;
}
</script>

</body>
</html>
