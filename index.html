<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Чип-тюнинг и калибровка ЭБУ удалённо по всей России | Kalibr-ECU</title>

<meta name="description" content="Удалённая калибровка прошивок ЭБУ с гарантией 1 год. Отключение AdBlue (мочевины), DPF, EGR для легковых и грузовых авто (Sitrak, Howo, Shacman, КАМАЗ, МАЗ, ГАЗ). Цены от 2500₽.">

<link rel="icon" href="/favicon.ico">

<style>
:root{
--primary-dark:#0A0E1A;
--secondary-dark:#0D1117;
--accent-blue:#0066FF;
--accent-light:#0099FF;
--text-white:#fff;
--text-gray:#8899A6;
--border-color:#1E2A3A;
}

body{
margin:0;
font-family:Arial;
background:var(--primary-dark);
color:var(--text-white);
}

/* ===== CALCULATOR ===== */
.calc-section{
padding:80px 20px;
background:linear-gradient(180deg,#0A0E1A,#0D1117);
border-top:1px solid var(--border-color);
border-bottom:1px solid var(--border-color);
}

.calc-wrap{
max-width:900px;
margin:0 auto;
background:rgba(255,255,255,0.03);
border:1px solid var(--border-color);
border-radius:20px;
padding:30px;
}

.calc-title{
font-size:28px;
margin-bottom:20px;
text-align:center;
}

.calc-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.calc-input, .calc-select{
padding:14px;
border-radius:10px;
border:1px solid var(--border-color);
background:#0A0E1A;
color:#fff;
}

.calc-result{
margin-top:20px;
padding:20px;
background:rgba(0,102,255,0.1);
border:1px solid var(--accent-blue);
border-radius:12px;
text-align:center;
font-size:22px;
font-weight:700;
}

.calc-btn{
margin-top:15px;
width:100%;
padding:14px;
background:linear-gradient(135deg,#0066FF,#0099FF);
border:none;
color:#fff;
font-weight:700;
border-radius:10px;
cursor:pointer;
}

@media(max-width:768px){
.calc-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<!-- ===== ТВОЙ САЙТ (ОСТАВЛЕН БЕЗ ИЗМЕНЕНИЙ) ===== -->
<!-- header + hero + services (твой оригинальный код тут полностью) -->

<!-- ========================= -->
<!-- 🔥 CALCULATOR BLOCK -->
<!-- ========================= -->
<section class="calc-section" id="calculator">
<div class="calc-wrap">

<h2 class="calc-title">Калькулятор стоимости прошивки</h2>

<div class="calc-grid">

<select class="calc-select" id="carType">
<option value="3000">Легковой авто</option>
<option value="4500">Грузовой (средний)</option>
<option value="6000">Тяжёлый грузовик</option>
</select>

<select class="calc-select" id="serviceType">
<option value="0">Чип-тюнинг</option>
<option value="2500">Отключение экологии</option>
<option value="4000">Комплекс (Stage + Eco)</option>
</select>

<input class="calc-input" type="number" id="power" placeholder="Мощность (л.с.)">

<input class="calc-input" type="number" id="discount" placeholder="Скидка %" value="0">

</div>

<div class="calc-result" id="result">
Стоимость: 0 ₽
</div>

<button class="calc-btn" onclick="calcPrice()">Рассчитать</button>

</div>
</section>

<script>
function calcPrice(){
const car = parseInt(document.getElementById('carType').value);
const service = parseInt(document.getElementById('serviceType').value);
const power = parseInt(document.getElementById('power').value || 0);
const discount = parseInt(document.getElementById('discount').value || 0);

let price = car + service;

if(power > 300) price += 1000;
if(power > 500) price += 2000;

price = price - (price * discount / 100);

document.getElementById('result').innerText =
"Стоимость: " + Math.round(price) + " ₽";
}
</script>

<!-- ===== ТВОЙ ОРИГИНАЛЬНЫЙ JS ===== -->
<script>
/* сюда вставь свой существующий JS БЕЗ ИЗМЕНЕНИЙ */
</script>

</body>
</html>
