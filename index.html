<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Чип-тюнинг и калибровка ЭБУ удалённо по всей России | Kalibr-ECU</title>

<!-- ТВОЙ CSS НЕ ТРОГАЮ -->
<style>
/* ===== КАЛЬКУЛЯТОР (ИЗОЛЯЦИЯ) ===== */
.cc-wrap{
    padding:70px 20px;
    background:linear-gradient(180deg,#0A0E1A,#0D1117);
}

.cc-container{
    max-width:900px;
    margin:0 auto;
}

.cc-box{
    background:rgba(255,255,255,0.03);
    border:1px solid #1E2A3A;
    border-radius:16px;
    padding:25px;
}

.cc-title{
    font-size:28px;
    margin-bottom:10px;
}

.cc-sub{
    color:#8899A6;
    margin-bottom:20px;
}

.cc-box select,
.cc-box button{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:10px;
    border:1px solid #1E2A3A;
    background:#0D1117;
    color:#fff;
    outline:none;
}

.cc-box button{
    background:linear-gradient(135deg,#0066FF,#0099FF);
    cursor:pointer;
    font-weight:600;
}

.cc-result{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:#0D1117;
    border:1px solid #1E2A3A;
    display:none;
}
</style>

</head>

<body>

<!-- ================= ТВОЙ САЙТ БЕЗ ИЗМЕНЕНИЙ ================= -->
<header class="header" id="header">
    <div class="container">
        <div class="header-top">
            <div class="header-contacts">
                <a href="tel:+79000978031" class="header-phone">📞 +7 (900) 097-80-31</a>
            </div>
            <div class="header-address">🌍 Работаем по всей России</div>
        </div>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h1>Калибровка прошивок ЭБУ</h1>
        <p>Удалённый чип-тюнинг</p>
    </div>
</section>

<!-- ================== ТВОЙ САЙТ ДАЛЬШЕ (НЕ УКОРАЧИВАЮ) ================== -->
<!-- тут остаётся весь твой код без изменений -->
<!-- services / pricing / reviews / faq и т.д. -->



<!-- ================= КАЛЬКУЛЯТОР (ВСТАВЛЕН) ================= -->
<section class="cc-wrap">
<div class="cc-container">
    <div class="cc-box">

        <div class="cc-title">Подбор Stage 1</div>
        <div class="cc-sub">Реальный прирост мощности под двигатель</div>

        <select id="cc-brand">
            <option value="">Марка</option>
            <option value="vag">VAG</option>
            <option value="bmw">BMW</option>
            <option value="merc">Mercedes</option>
            <option value="truck">Грузовые</option>
        </select>

        <select id="cc-model">
            <option>Сначала выберите марку</option>
        </select>

        <button id="cc-btn">Рассчитать</button>

        <div id="cc-result" class="cc-result"></div>

    </div>
</div>
</section>

<!-- ================= FOOTER (ТВОЙ ОРИГИНАЛ) ================= -->
<footer class="footer">
    <div class="container">
        <p style="color:#8899A6;">© Kalibr-ECU</p>
    </div>
</footer>

<!-- ================= JS (ИЗОЛЯЦИЯ, НЕ ЛЕЗЕТ В ТВОЙ САЙТ) ================= -->
<script>
(function(){

const DB = {
    vag:{
        "2.0 TSI EA888":{hp:220,nm:350,st:300,stnm:450},
        "2.0 TDI 184":{hp:184,nm:380,st:230,stnm:480}
    },
    bmw:{
        "B48 2.0":{hp:184,nm:300,st:260,stnm:420},
        "B58 3.0":{hp:340,nm:500,st:420,stnm:620}
    },
    merc:{
        "OM651":{hp:170,nm:400,st:210,stnm:480}
    },
    truck:{
        "Cummins ISF":{hp:152,nm:491,st:185,stnm:560}
    }
};

const brand=document.getElementById("cc-brand");
const model=document.getElementById("cc-model");

if(brand){
brand.addEventListener("change",()=>{
    model.innerHTML='<option>Выберите двигатель</option>';

    if(!DB[brand.value]) return;

    Object.keys(DB[brand.value]).forEach(m=>{
        const opt=document.createElement("option");
        opt.value=m;
        opt.textContent=m;
        model.appendChild(opt);
    });
});
}

const btn=document.getElementById("cc-btn");

if(btn){
btn.addEventListener("click",()=>{
    const b=brand.value;
    const m=model.value;
    if(!b||!m) return;

    const d=DB[b][m];

    const res=document.getElementById("cc-result");
    res.style.display="block";

    res.innerHTML=`
        <b>${m}</b><br><br>
        Сток: ${d.hp} л.с. / ${d.nm} Нм<br>
        Stage 1: ${d.st} л.с. / ${d.stnm} Нм<br><br>
        <span style="color:#0099ff">
        +${d.st-d.hp} л.с. / +${d.stnm-d.nm} Нм
        </span>
    `;
});
}

})();
</script>

</body>
</html>
