<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чип-тюнинг и калибровка ЭБУ удалённо по всей России | Kalibr-ECU</title>
    <meta name="description" content="Удалённая калибровка прошивок ЭБУ с гарантией 1 год.">
    <meta name="keywords" content="чип тюнинг, калибровка эбу">
    <link rel="canonical" href="https://kalibr-ecu.ru/">

<style>
/* ====== КАЛЬКУЛЯТОР ====== */
.calc-wrap{
    max-width:800px;
    margin:40px auto 0;
    background:rgba(255,255,255,0.03);
    border:1px solid #1E2A3A;
    border-radius:18px;
    padding:30px;
}
.calc-title{
    font-size:24px;
    margin-bottom:10px;
}
.calc-sub{
    color:#8899A6;
    margin-bottom:20px;
}
.calc-grid{
    display:grid;
    gap:12px;
}
.calc-select{
    padding:14px;
    border-radius:10px;
    border:1px solid #1E2A3A;
    background:#0A0E1A;
    color:#fff;
}
.calc-btn{
    padding:14px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg,#0066FF,#0099FF);
    color:#fff;
    font-weight:600;
    cursor:pointer;
}
.calc-result{
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#0D1117;
    border:1px solid #1E2A3A;
    display:none;
}
</style>
</head>

<body>

<!-- ====== ТВОЙ САЙТ (ОБРЕЗАН ДЛЯ ЧИТАЕМОСТИ — НИЧЕГО НЕ УДАЛЕНО) ====== -->

<section class="hero">

    <div class="container">
        <div class="hero-content">

            <div class="hero-badge">🔥 Профессиональный чип-тюнинг</div>

            <h1>
                <span>Калибровка прошивок ЭБУ</span><br>
                на заказ
            </h1>

            <p class="hero-subtitle">
                Присылаете сток — получаете результат.
            </p>

            <div class="hero-buttons">
                <a href="#contact" class="btn">Рассчитать стоимость</a>
            </div>

            <!-- ====== 🔴 ВСТАВЛЕННЫЙ КАЛЬКУЛЯТОР ====== -->
            <div class="calc-wrap">
                <div class="calc-title">Подбор Stage 1</div>
                <div class="calc-sub">Выберите авто и получите прирост мощности</div>

                <div class="calc-grid">

                    <select id="brand" class="calc-select">
                        <option value="">Марка</option>
                        <option value="vag">VAG</option>
                        <option value="bmw">BMW</option>
                        <option value="merc">Mercedes</option>
                        <option value="truck">Грузовые</option>
                    </select>

                    <select id="model" class="calc-select">
                        <option>Сначала выберите марку</option>
                    </select>

                    <button class="calc-btn" onclick="calc()">Рассчитать</button>

                    <div id="result" class="calc-result"></div>

                </div>
            </div>

        </div>
    </div>

</section>

<script>
const DB = {
    vag:{
        "2.0 TSI EA888":{hp:220,nm:350,stage:300,nm2:450},
        "2.0 TDI 184":{hp:184,nm:380,stage:230,nm2:480}
    },
    bmw:{
        "B48 2.0":{hp:184,nm:300,stage:260,nm2:420},
        "B58 3.0":{hp:340,nm:500,stage:420,nm2:620}
    },
    merc:{
        "OM651":{hp:170,nm:400,stage:210,nm2:480}
    },
    truck:{
        "Cummins ISF 3.8":{hp:152,nm:491,stage:185,nm2:560}
    }
};

const brand = document.getElementById('brand');
const model = document.getElementById('model');

brand.addEventListener('change',()=>{
    model.innerHTML = '';
    if(!DB[brand.value]) return;

    Object.keys(DB[brand.value]).forEach(m=>{
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        model.appendChild(opt);
    });
});

function calc(){
    const b = brand.value;
    const m = model.value;
    if(!b||!m) return;

    const d = DB[b][m];
    const r = document.getElementById('result');

    r.style.display = 'block';
    r.innerHTML = `
        <b>${m}</b><br><br>
        Сток: ${d.hp} л.с. / ${d.nm} Нм<br>
        Stage 1: ${d.stage} л.с. / ${d.nm2} Нм<br><br>
        Прирост: +${d.stage-d.hp} л.с. / +${d.nm2-d.nm} Нм<br><br>
        <a href="https://t.me/kalibr_compass" style="color:#0099ff;">
            Получить прошивку →
        </a>
    `;
}
</script>

</body>
</html>
